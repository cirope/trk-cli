version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      # Card content in fixtures and tests is often Spanish.
      ignore-rules:
        - producto
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests read and run what they set up themselves.
      - path: _test\.go
        linters: [gosec]
        text: "G122|G204|G304|G703"

formatters:
  enable:
    - gofmt
